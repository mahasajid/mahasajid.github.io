name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!docs/CONTRIBUTING.md"
      - "!docs/CUSTOMIZE.md"
      - "!docs/FAQ.md"
      - "!docs/INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!docs/CONTRIBUTING.md"
      - "!docs/CUSTOMIZE.md"
      - "!docs/FAQ.md"
      - "!docs/INSTALL.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Reconstruct CV PDF 📄
        run: |
          {
            cat assets/pdf/cv_chunks/00.txt
            cat assets/pdf/cv_chunks/01.txt
            cat assets/pdf/cv_chunks/02a.txt
            cat assets/pdf/cv_chunks/02b1_0.txt
            cat assets/pdf/cv_chunks/02b1_1.txt
            cat assets/pdf/cv_chunks/02b1_2.txt
            cat assets/pdf/cv_chunks/02b2_0.txt
            cat assets/pdf/cv_chunks/02b2_1.txt
            cat assets/pdf/cv_chunks/02b2_2.txt
            cat assets/pdf/cv_chunks/03.txt
            cat assets/pdf/cv_chunks/04.txt
            cat assets/pdf/cv_chunks/05_00.txt
            cat assets/pdf/cv_chunks/05_01.txt
            cat assets/pdf/cv_chunks/05_02.txt
            cat assets/pdf/cv_chunks/05_03.txt
            cat assets/pdf/cv_chunks/05_04.txt
            cat assets/pdf/cv_chunks/05_05.txt
            cat assets/pdf/cv_chunks/05_06.txt
            cat assets/pdf/cv_chunks/05_07.txt
            cat assets/pdf/cv_chunks/05_08.txt
            cat assets/pdf/cv_chunks/05_09.txt
            cat assets/pdf/cv_chunks/05_10.txt
            cat assets/pdf/cv_chunks/05_11.txt
            cat assets/pdf/cv_chunks/06a.txt
            cat assets/pdf/cv_chunks/06b.txt
            cat assets/pdf/cv_chunks/07.txt
          } | tr -d '\r\n' | base64 --decode > assets/pdf/Maha_Sajid_CV.pdf
          echo "705a8ca83f64ff31bdef0f518332c233834f90b5a847b0eaa50122027fe0601c  assets/pdf/Maha_Sajid_CV.pdf" | sha256sum --check --strict
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps 📦
        run: npm ci
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
